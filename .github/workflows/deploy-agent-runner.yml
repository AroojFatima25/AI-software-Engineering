# Deploys the agent-runner Supabase Edge Function.
#
# Requires one repository secret (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN — a Supabase personal access token (https://supabase.com/dashboard/account/tokens)
#
# The token is only ever read by the Supabase CLI inside the runner; it is
# never echoed. Function runtime secrets are already configured in the
# Supabase project and are NOT touched by this workflow.

name: Deploy agent-runner

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a072ea-ai-software-engineering
    paths:
      - "supabase/functions/agent-runner/**"
      - "supabase/tests/**"
      - ".github/workflows/deploy-agent-runner.yml"

concurrency:
  group: deploy-agent-runner
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: dvspibrxsqyfdtryqogc

jobs:
  checks:
    name: Function checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck (index.ts + lib)
        working-directory: supabase/functions/agent-runner
        run: deno task check:all

      - name: Lint
        working-directory: supabase/functions/agent-runner
        run: deno lint

      - name: Tests
        run: deno test --allow-net --allow-env --allow-read supabase/tests/

  deploy:
    name: Deploy to Supabase
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure deploy token is configured
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is not set. Add it under Settings → Secrets and variables → Actions." >&2
            exit 1
          fi
          echo "Deploy token is present (value not shown)."

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy agent-runner
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy agent-runner \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --workdir .

      - name: Verify health endpoint
        run: |
          url="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/agent-runner/health"
          echo "GET $url"
          for i in 1 2 3 4 5; do
            body="$(curl -fsS --max-time 15 "$url")" && break
            echo "Attempt $i failed; retrying in 3s..."
            sleep 3
          done
          if [ -z "${body:-}" ]; then
            echo "::error::Health endpoint did not respond successfully." >&2
            exit 1
          fi
          # /health returns stage keys, limits and presence booleans only — no secret values.
          echo "$body"
          echo "$body" | grep -q '"ok"[[:space:]]*:[[:space:]]*true' \
            || { echo "::error::Health endpoint responded but ok!=true." >&2; exit 1; }
          echo "Function URL: https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/agent-runner"
